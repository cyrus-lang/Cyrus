name: Cyrus Linux

on:
  push:
    branches: ["**"]
    tags:
      - "v*"
  pull_request:
    branches: ["**"]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt install -y \
            software-properties-common \
            llvm-18 llvm-18-dev clang-18 \
            zlib1g zlib1g-dev libpolly-18-dev \
            upx libasan8

      - name: Install Rust
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          override: true

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2

      - name: Build
        env:
          LLVM_CONFIG: /usr/bin/llvm-config-18
          CC: clang
          CXX: clang++
        run: |
          chmod +x ./scripts/release.sh
          ./scripts/release.sh

      - name: Run tests
        env:
          LLVM_CONFIG: /usr/bin/llvm-config-18
          CC: clang
          CXX: clang++
        run: make testsuite PROFILE=release

      - name: Determine package version
        id: version
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            VERSION=${GITHUB_REF#refs/tags/v}
          else
            VERSION="0.0.0-$(git rev-parse --short HEAD)"
          fi
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: cyrus-binary
          path: |
            ./target/release/cyrus
            ./stdlib
            ./scripts/install.sh

      - name: Upload zip artifact (for users who want portable binary)
        uses: actions/upload-artifact@v4
        with:
          name: cyrus-portable
          path: ./target/release/cyrus

      - name: Generate PKGBUILD for Arch Linux
        run: |
          cat > PKGBUILD << 'EOF'
          # Maintainer: Cyrus Developers <dev@cyrus-lang.org>
          pkgname=cyrus
          pkgver=${{ steps.version.outputs.VERSION }}
          pkgrel=1
          pkgdesc="Cyrus programming language"
          arch=('x86_64')
          url="https://github.com/${{ github.repository }}"
          license=('MIT')
          depends=('zlib' 'llvm' 'clang' 'polly' 'gcc-libs')
          makedepends=('unzip')
          source=("cyrus-linux-${{ steps.version.outputs.VERSION }}.zip")
          sha256sums=('SKIP')

          package() {
            cd "${srcdir}"
            unzip -q "cyrus-linux-${{ steps.version.outputs.VERSION }}.zip"
            install -Dm755 "./cyrus/cyrus" "${pkgdir}/usr/bin/cyrus"
            cp -r "./cyrus/stdlib" "${pkgdir}/usr/share/cyrus/"
            if [ -f "./cyrus/install.sh" ]; then
              install -Dm755 "./cyrus/install.sh" "${pkgdir}/usr/share/cyrus/install.sh"
            fi
          }
          EOF

          echo "Generated PKGBUILD:"
          cat PKGBUILD

      - name: Upload PKGBUILD artifact
        uses: actions/upload-artifact@v4
        with:
          name: cyrus-pkgbuild
          path: ./PKGBUILD

  build-deb:
    runs-on: ubuntu-24.04
    needs: build
    steps:
      - name: Install fpm
        run: |
          sudo apt-get update
          sudo apt-get install -y ruby ruby-dev build-essential
          sudo gem install fpm

      - name: Download binary
        uses: actions/download-artifact@v4
        with:
          name: cyrus-binary
          path: ./binary

      - name: Determine version
        id: version
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            VERSION=${GITHUB_REF#refs/tags/v}
          else
            VERSION="0.0.0-$(git rev-parse --short HEAD)"
          fi
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT

      - name: Build .deb package
        run: |
          mkdir -p ./package/usr/bin
          mkdir -p ./package/usr/share/cyrus
          cp ./binary/cyrus ./package/usr/bin/
          cp -r ./binary/stdlib ./package/usr/share/cyrus/
          cp ./binary/install.sh ./package/usr/share/cyrus/

          fpm -s dir -t deb \
            -n cyrus \
            -v ${{ steps.version.outputs.VERSION }} \
            --url "https://github.com/${{ github.repository }}" \
            --description "Cyrus programming language" \
            --license "MIT" \
            --depends "zlib1g" \
            --depends "libasan8" \
            --depends "libpolly-18-dev" \
            -C ./package \
            -p cyrus-${{ steps.version.outputs.VERSION }}.deb \
            usr/

      - name: Upload .deb package
        uses: actions/upload-artifact@v4
        with:
          name: cyrus-deb
          path: ./cyrus-*.deb

  build-rpm:
    runs-on: fedora-latest
    needs: build
    steps:
      - name: Install fpm
        run: |
          sudo dnf install -y ruby ruby-devel gcc-c++ make
          sudo gem install fpm

      - name: Download binary
        uses: actions/download-artifact@v4
        with:
          name: cyrus-binary
          path: ./binary

      - name: Determine version
        id: version
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            VERSION=${GITHUB_REF#refs/tags/v}
          else
            VERSION="0.0.0-$(git rev-parse --short HEAD)"
          fi
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT

      - name: Build .rpm package
        run: |
          mkdir -p ./package/usr/bin
          mkdir -p ./package/usr/share/cyrus
          cp ./binary/cyrus ./package/usr/bin/
          cp -r ./binary/stdlib ./package/usr/share/cyrus/
          cp ./binary/install.sh ./package/usr/share/cyrus/

          fpm -s dir -t rpm \
            -n cyrus \
            -v ${{ steps.version.outputs.VERSION }} \
            --url "https://github.com/${{ github.repository }}" \
            --description "Cyrus programming language" \
            --license "MIT" \
            --depends "zlib" \
            --depends "libasan" \
            --depends "polly" \
            -C ./package \
            -p cyrus-${{ steps.version.outputs.VERSION }}.rpm \
            usr/

      - name: Upload .rpm package
        uses: actions/upload-artifact@v4
        with:
          name: cyrus-rpm
          path: ./cyrus-*.rpm

  release:
    needs: [build, build-deb, build-rpm]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./release-files

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ./release-files/cyrus-deb/*.deb
            ./release-files/cyrus-rpm/*.rpm
            ./release-files/cyrus-pkgbuild/PKGBUILD
            ./release-files/cyrus-portable/cyrus
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
