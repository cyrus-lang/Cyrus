name: Cyrus Linux

on:
  push:
    branches: ["**"]
    tags:
      - "v*"
  pull_request:
    branches: ["**"]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build-linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt install -y \
            software-properties-common \
            llvm-18 llvm-18-dev clang-18 \
            zlib1g zlib1g-dev libpolly-18-dev \
            upx libasan8 \
            ruby ruby-dev build-essential \
            zip

      - name: Install fpm (package builder)
        run: sudo gem install fpm

      - name: Install Rust
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          override: true

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2

      - name: Build
        env:
          LLVM_CONFIG: /usr/bin/llvm-config-18
          CC: clang
          CXX: clang++
        run: |
          chmod +x ./scripts/release.sh
          ./scripts/release.sh

      - name: Run tests
        env:
          LLVM_CONFIG: /usr/bin/llvm-config-18
          CC: clang
          CXX: clang++
        run: make testsuite PROFILE=release

      - name: Determine package version
        id: version
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            VERSION=${GITHUB_REF#refs/tags/v}
          else
            VERSION="0.0.0-$(git rev-parse --short HEAD)"
          fi
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT

      # Build .deb package
      - name: Build .deb package with fpm
        run: |
          mkdir -p ./package/usr/bin
          mkdir -p ./package/usr/share/cyrus
          cp ./target/release/cyrus ./package/usr/bin/
          cp -r ./stdlib ./package/usr/share/cyrus/
          cp ./scripts/install.sh ./package/usr/share/cyrus/
          fpm -s dir -t deb \
            -n cyrus \
            -v ${{ steps.version.outputs.VERSION }} \
            --url "https://github.com/${{ github.repository }}" \
            --description "Cyrus programming language" \
            --license "MIT" \
            --depends "zlib1g" \
            --depends "libasan8" \
            --depends "libpolly-18-dev" \
            -C ./package \
            -p cyrus-${{ steps.version.outputs.VERSION }}.deb \
            usr/

      # Create zip file
      - name: Collect files for zip
        run: |
          mkdir cyrus
          cp ./target/release/cyrus ./cyrus
          cp ./scripts/install.sh ./cyrus
          cp -r ./stdlib ./cyrus/

      - name: Zip release files
        run: |
          zip -r -9 cyrus-linux-${{ steps.version.outputs.VERSION }}.zip ./cyrus

      # Generate PKGBUILD for Arch Linux
      - name: Generate PKGBUILD
        run: |
          cat > PKGBUILD << 'EOF'
          # Maintainer: Cyrus Developers <dev@cyrus-lang.org>
          pkgname=cyrus
          pkgver=${{ steps.version.outputs.VERSION }}
          pkgrel=1
          pkgdesc="Cyrus programming language"
          arch=('x86_64')
          url="https://github.com/${{ github.repository }}"
          license=('MIT')
          depends=('zlib' 'llvm' 'clang' 'polly' 'gcc-libs')
          makedepends=('unzip')
          source=("cyrus-linux-${{ steps.version.outputs.VERSION }}.zip")
          sha256sums=('SKIP')
          
          package() {
            cd "${srcdir}"
            unzip -q "cyrus-linux-${{ steps.version.outputs.VERSION }}.zip"
            install -Dm755 "./cyrus/cyrus" "${pkgdir}/usr/bin/cyrus"
            cp -r "./cyrus/stdlib" "${pkgdir}/usr/share/cyrus/"
            if [ -f "./cyrus/install.sh" ]; then
              install -Dm755 "./cyrus/install.sh" "${pkgdir}/usr/share/cyrus/install.sh"
            fi
          }
          EOF
          
          echo "Generated PKGBUILD:"
          cat PKGBUILD

      # Upload .deb artifact
      - name: Upload .deb artifact
        uses: actions/upload-artifact@v4
        with:
          name: cyrus-deb
          path: ./cyrus-*.deb

      # Upload zip artifact
      - name: Upload zip artifact
        uses: actions/upload-artifact@v4
        with:
          name: cyrus-linux
          path: ./cyrus-linux-*.zip

      # Upload PKGBUILD artifact
      - name: Upload PKGBUILD artifact
        uses: actions/upload-artifact@v4
        with:
          name: cyrus-pkgbuild
          path: ./PKGBUILD

  build-rpm:
    runs-on: fedora-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo dnf install -y \
            llvm-devel clang zlib-devel polly-devel \
            upx libasan \
            ruby ruby-devel gcc-c++ make

      - name: Install fpm
        run: sudo gem install fpm

      - name: Install Rust
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          override: true

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2

      - name: Build
        env:
          LLVM_CONFIG: /usr/bin/llvm-config
          CC: clang
          CXX: clang++
        run: |
          chmod +x ./scripts/release.sh
          ./scripts/release.sh

      - name: Run tests
        env:
          LLVM_CONFIG: /usr/bin/llvm-config
          CC: clang
          CXX: clang++
        run: make testsuite PROFILE=release

      - name: Determine version
        id: version
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            VERSION=${GITHUB_REF#refs/tags/v}
          else
            VERSION="0.0.0-$(git rev-parse --short HEAD)"
          fi
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT

      - name: Build .rpm package with fpm
        run: |
          mkdir -p ./package/usr/bin
          mkdir -p ./package/usr/share/cyrus
          cp ./target/release/cyrus ./package/usr/bin/
          cp -r ./stdlib ./package/usr/share/cyrus/
          cp ./scripts/install.sh ./package/usr/share/cyrus/
          fpm -s dir -t rpm \
            -n cyrus \
            -v ${{ steps.version.outputs.VERSION }} \
            --url "https://github.com/${{ github.repository }}" \
            --description "Cyrus programming language" \
            --license "MIT" \
            --depends "zlib" \
            --depends "libasan" \
            --depends "polly" \
            -C ./package \
            -p cyrus-${{ steps.version.outputs.VERSION }}.rpm \
            usr/

      - name: Upload .rpm artifact
        uses: actions/upload-artifact@v4
        with:
          name: cyrus-rpm
          path: ./cyrus-*.rpm

  release:
    needs: [build-linux, build-rpm]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./release-files

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ./release-files/cyrus-deb/*.deb
            ./release-files/cyrus-linux/*.zip
            ./release-files/cyrus-rpm/*.rpm
            ./release-files/cyrus-pkgbuild/PKGBUILD
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}